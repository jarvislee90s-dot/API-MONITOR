name = "apimonitor"
main = "./worker/index.ts"
compatibility_date = "2026-06-11"
compatibility_flags = [ "nodejs_compat" ]

[vars]
OPENROUTER_BASE_URL = "https://openrouter.ai"
OPENCODE_GO_BASE_URL = "https://opencode.ai"
XFYUN_MAAS_PAGE_URL = "https://maas.xfyun.cn/packageSubscription"

[[durable_objects.bindings]]
name = "REFRESH_SESSION"
class_name = "RefreshSessionDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RefreshSessionDurableObject"]

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

[browser]
binding = "OPENCODE_BROWSER"

# 自定义域名：绕开 *.workers.dev 的 DNS 污染与 SNI 阻断，国内可直连
[[routes]]
pattern = "apimonitor.bondtoolbox.asia"
custom_domain = true
